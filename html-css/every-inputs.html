<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>all inputs</title>
    </head>
    <body>
	<label for="col">color picker</label>
	<input type="color" name="name" value="value">
	<br>
	<label for="txt">text</label>
	<input type="text" name="name" value="text" id="txt" placeholder=". . .">
	<br>
	<label for="chb">checkbox</label>
	<input type="checkbox" name="name" value="value" id="chb">
	<br>
	<label for="slider">Label</label>
	<input type="range" name="name" value="100" id="slider">
	<br>
	<label for="num">number</label>
	<input type="number" name="name" value="1234" id="num">
    </body>
