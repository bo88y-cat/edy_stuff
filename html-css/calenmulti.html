<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>calendar multiplayer</title>
    </head>
    <body>
	<h2>calenmulti</h2>
	<label for="data">enter date:</label>
	<input type="date" name="name" value="value" id="data">
	<br>
	<label for="clock">enter time:</label>
	<input type="time" name="name" value="value" id="clock">
	<br>
	<label for="dack">enter date and time:</label>
	<input type="datetime-local" name="name" value="value" id="dack">
	<br>
	<input type="checkbox" name="name" value="value" id="chb">
	<label for="chb">I am sure this is the date and time</label>
    </body>
