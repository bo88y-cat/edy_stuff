<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>html inputs</title>
</head>
<body>
    <label for="col">color picker</label>
    <input type="color" name="name" value="value" id="col">
    <hr>
    <label for="chb">checkbox</label>
    <input type="checkbox" name="name" value="value" id="chb">
	<hr>
	<label for="data">date</label>
	<input type="date" name="name" value="value" id="data">
	<hr>
	<input type="text" name="name" value="text">
	<hr>
	<input type="number" name="name" value="0211">
	<hr>
	<label for="buto">button</label>
	<input type="button" name="name" value="click me" id="buto">
	<hr>
	<label for="clock">time</label>
	<input type="time" name="name" value="value" id="clock">
	<hr>
	<label for="radibu">radio</label>
	<input type="radio" name="name" value="value">
	<br>
	<label for="in">input</label>
	<input type="radio" name="name" value="value" id="in">
	<hr>
	<label for="rang">range</label>
	<input type="range" name="name" value="0" id="rang">
	<hr>
	<label for="enmail">email</label>
	<input type="email" name="name" value="" id="enmail">
	<hr>
	<label for="phon">enter phone number</label>
	<input type="tel" name="name" value="123-45-678" id="phon">
	<br>
	<strong>Formats 123-345-678</strong>
</body>
<script>
    let btn = document.getElementById('buto');
    btn.addEventListener('click', () => {
      window.alert("this button does nothing")
    })
</script>
</html>
</html>
